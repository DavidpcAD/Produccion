name: Deploy a Azure App Service

# Despliega Produccion (Next.js standalone) a App Service en cada push a main.
# El build (npm ci + next build) corre acá; App Service solo recibe el paquete ya
# compilado. Auth del deploy: publish profile en el secret AZURE_WEBAPP_PUBLISH_PROFILE.
#
# Antes del primer deploy:
#   1) Correr scripts/azure-setup.ps1 (crea el Web App y carga las env vars).
#   2) Subir el publish profile como secret AZURE_WEBAPP_PUBLISH_PROFILE en GitHub.
#   3) Ajustar AZURE_WEBAPP_NAME abajo al nombre EXACTO del Web App creado.

# CD activo: cada push a main compila y despliega a usuarios-ad (el App Service que
# sirve usuarios.adelante.cr / produccion.adelante.cr). También se puede correr manual.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Serializa los deploys: si llegan dos pushes seguidos, el segundo espera a que
# termine el primero en vez de chocar con Azure OneDeploy (409 Conflict).
concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  AZURE_WEBAPP_NAME: usuarios-ad   # App Service reutilizado (rg-controlusuarios). Sirve usuarios.adelante.cr + produccion.adelante.cr
  NODE_VERSION: "22.x"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build (Next standalone)
        run: npm run build

      - name: Empaquetar standalone
        # `next build` con output:standalone deja server.js + node_modules mínimos en
        # .next/standalone, pero NO copia .next/static ni public: se arman a mano.
        #
        # `-L` (resolver symlinks) NO es cosmético: standalone crea 4 symlinks en
        # .next/node_modules (mssql, import-in-the-middle x2, require-in-the-middle) y en
        # el wwwroot del App Service esas rutas ya existen como CARPETAS REALES (las dejó
        # un deploy manual viejo). El rsync de Kudu corre sin --delete/--force, así que no
        # puede reemplazar una carpeta no vacía por un symlink: falla con
        # "could not make way for new symlink" (exit 23) y mata el thread que le tocó ese
        # split → el deploy sube SOLO PARTE del build, Kudu igual reporta "Deployment
        # successful" y el sitio se queda con el build anterior. Copiando el contenido en
        # vez del symlink (son 264 KB) el rsync sincroniza carpeta contra carpeta y pasa.
        run: |
          mkdir -p deploy-package
          cp -rL .next/standalone/. deploy-package/
          mkdir -p deploy-package/.next
          cp -r .next/static deploy-package/.next/static
          if [ -d public ]; then cp -r public deploy-package/public; fi

      - name: Deploy a Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: deploy-package
