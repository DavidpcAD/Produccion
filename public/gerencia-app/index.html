<style>
/* Layout: phone column. Header de semana, grilla 2 columnas (hero, pares, ancho), barra inferior.
   Mezcla: tiles vacíos estilo Losa Flotante (azul) + KPIs con tipografía condensada itálica estilo Nike Run. */
:root {
  --ground: #F4F6F8;
  --surface: #FFFFFF;
  --ink: #0B0C0D;
  --ink-2: #5B6470;
  --line: #DADFE5;
  --losa: #4FA3E0;          /* foco y enlaces */
  --slot: #ADD010;          /* borde y + de placeholders */
  --slot-fill: #EEF6CC;     /* relleno de placeholders */
  --volt: #ADD010;          /* hero y acentos de dato */
  --volt-deep: #4F6006;     /* botones sobre volt */
  --tile-dark: #111315;
  --good: #3DDC84;
  --bad: #FF6B5E;
  --scrim: rgba(28, 32, 38, .34);

  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue Condensed", Impact, sans-serif;
  --body: "Barlow", "Helvetica Neue", Arial, sans-serif;

  --r-tile: 24px;
  --r-card: 30px;
  --ease-snap: cubic-bezier(.2, .9, .25, 1.15);
  --hold: 450ms;
  color-scheme: light;
}
/* El documento nunca scrollea (en iOS eso arrastra todo el webview). Cada pantalla es su propio
   contenedor con el rebote nativo; contain evita que el gesto se pase al documento. */
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
.scroller { position: fixed; inset: 0; overflow-y: auto; overscroll-behavior-y: contain; -webkit-overflow-scrolling: touch; }
.scroller > .app, .scroller > .alerts { min-height: calc(100% + 1px); box-sizing: border-box; }
#s-inicio { background: var(--ground); }
#s-alertas { background: var(--surface); }
body {
  background: var(--ground);
  color: var(--ink);
  font-family: var(--body);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
body.locked { overflow: hidden; }

.app {
  max-width: 440px;
  margin: 0 auto;
  min-height: 100%;
  display: flex;
  flex-direction: column;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  padding-block: 18px calc(96px + env(safe-area-inset-bottom, 0px));
}

/* ---------- Header ---------- */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--display); font-weight: 800; font-style: italic; font-size: 20px; letter-spacing: .02em; text-transform: uppercase; }
.brand span { color: var(--ink-2); font-weight: 600; font-style: normal; letter-spacing: .08em; font-size: 14px; margin-left: 6px; }
.sample { font-family: var(--display); font-weight: 600; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); border: 1.5px solid var(--line); border-radius: 999px; padding: 4px 10px; white-space: nowrap; }
.hello { padding-block: 34px 22px; }
.hello h1 { margin: 0; font-family: var(--display); font-weight: 900; font-style: italic; font-size: clamp(52px, 16vw, 68px); line-height: .86; letter-spacing: -.01em; text-transform: uppercase; text-wrap: balance; }
.hello p { margin: 10px 0 0; font-family: var(--display); font-weight: 600; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }

/* ---------- Grid ---------- */
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.tile {
  position: relative;
  border: 0;
  margin: 0;
  padding: 16px 16px 14px;
  border-radius: var(--r-tile);

  color: inherit;

.tile.wide { grid-column: span 2; height: 136px; }
.tile.pressing { transform: scale(.955); transition: transform var(--hold) cubic-bezier(.25, .7, .3, 1); }

.plus::after { top: 0; bottom: 0; left: 50%; width: 8px; margin-left: -4px; }
.tile.empty .slot-hint { position: absolute; left: 0; right: 0; bottom: 12px; text-align: center; font-family: var(--display); font-weight: 600; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--volt-deep); }

.tile.filled { background: var(--tile-dark); color: #fff; display: flex; flex-direction: column; }
.tile.filled.hero { background: var(--volt); color: var(--ink); }
.t-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.t-label { font-family: var(--display); font-weight: 700; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; line-height: 1.05; min-width: 0; }
.t-app { font-family: var(--display); font-weight: 600; font-size: 11px; letter-spacing: .1em; opacity: .55; flex: none; }
.t-num { margin-top: auto; font-family: var(--display); font-weight: 900; font-style: italic; line-height: .82; letter-spacing: -.02em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tile.sm .t-num { font-size: 54px; color: var(--volt); }
.tile.wide .t-num { font-size: 62px; color: var(--volt); }
.tile.hero .t-num { font-size: 112px; }
.t-unit { font-family: var(--display); font-weight: 700; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; opacity: .8; margin-top: 6px; }
.t-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; }
.delta { font-family: var(--display); font-weight: 700; font-size: 13px; letter-spacing: .04em; border-radius: 999px; padding: 3px 9px 2px; background: rgba(255, 255, 255, .1); white-space: nowrap; font-variant-numeric: tabular-nums; }

/* ---------- Bottom bar ---------- */
.bar {

}
.bar-in { max-width: 440px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px max(12px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; border: 0; background: none; cursor: pointer; color: var(--ink-2); font: 700 11px var(--display); letter-spacing: .08em; text-transform: uppercase; }
.tab .ic { display: grid; place-items: center; width: 56px; height: 32px; border-radius: 999px; }

.tab:focus-visible { outline: 3px solid var(--losa); outline-offset: -3px; border-radius: 14px; }

/* ---------- Picker (popup) ---------- */
.scrim { position: fixed; inset: 0; z-index: 20; background: var(--scrim); }
.card {
  position: fixed; z-index: 21;
  background: var(--surface);
  border-radius: var(--r-card);
  box-shadow: 0 0 0 1px rgba(0, 0, 0, .06), 0 24px 60px rgba(20, 24, 30, .22);
  overflow: hidden;
}
.card-in { display: flex; flex-direction: column; height: 100%; }
.card-head { padding: 22px 22px 10px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.card-head h2 { margin: 0; font-family: var(--display); font-weight: 900; font-style: italic; font-size: 36px; line-height: .9; text-transform: uppercase; }
.card-head p { margin: 6px 0 0; font-size: 13px; color: var(--ink-2); }
.x { flex: none; width: 36px; height: 36px; border-radius: 12px; border: 0; background: var(--ground); cursor: pointer; display: grid; place-items: center; }

.x:focus-visible, .chip:focus-visible, .row:focus-visible, .remove:focus-visible, .back:focus-visible { outline: 3px solid var(--losa); outline-offset: 2px; }

.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px 5px; font-family: var(--display); font-weight: 700; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--volt); }
.list { flex: 1; overflow-y: auto; padding: 0 12px 12px; overscroll-behavior: contain; }
.group { font-family: var(--display); font-weight: 700; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); padding: 14px 10px 6px; }
.row { width: 100%; display: grid; grid-template-columns: 78px 1fr auto; align-items: center; gap: 12px; padding: 10px; border: 0; background: none; border-radius: 16px; text-align: left; cursor: pointer; font: inherit; color: inherit; }
.row:hover { background: var(--ground); }
.row, .group { overflow: hidden; transform-origin: 30px 50%; }
.row.current { background: var(--volt); }
.row-num { font-family: var(--display); font-weight: 900; font-style: italic; font-size: 30px; line-height: .9; letter-spacing: -.01em; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: clip; }
.row-txt { min-width: 0; }
.row-txt b { display: block; font-weight: 600; font-size: 15px; line-height: 1.2; }
.row-txt small { display: block; font-size: 12px; color: var(--ink-2); margin-top: 2px; }
.row.current .row-txt small { color: var(--ink); opacity: .7; }
.tag { font-family: var(--display); font-weight: 700; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); border: 1.5px solid var(--line); border-radius: 999px; padding: 2px 8px 1px; white-space: nowrap; }
.row.current .tag { border-color: var(--ink); color: var(--ink); }
.card-foot { padding: 10px 22px 18px; border-top: 1px solid var(--line); }
.remove { width: 100%; border: 0; background: var(--ground); border-radius: 14px; padding: 13px; font: 600 14px var(--body); color: var(--bad); cursor: pointer; }

/* ---------- Detail ---------- */
.detail { position: fixed; z-index: 30; background: var(--tile-dark); overflow: hidden; }
.detail-in { position: absolute; left: 0; top: 0; overflow-y: auto; overscroll-behavior: contain; color: #fff; touch-action: pan-y; }
.d-top {
  background: var(--volt); color: var(--ink);
  padding: calc(14px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) 74px max(20px, env(safe-area-inset-left, 0px));
  clip-path: polygon(0 0, 100% 0, 100% 80%, 50% 100%, 0 80%);
}
.d-bar { display: flex; justify-content: space-between; align-items: center; max-width: 440px; margin: 0 auto; }
.d-nav { position: sticky; bottom: 0; z-index: 2; background: color-mix(in srgb, var(--tile-dark) 86%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid #23272B; padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.d-nav-in { max-width: 440px; margin: 0 auto; display: flex; }
.back { height: 52px; padding: 0 22px 0 14px; border-radius: 16px; border: 0; background: var(--volt); color: var(--ink); cursor: pointer; display: flex; align-items: center; gap: 6px; font: italic 900 22px var(--display); text-transform: uppercase; }
.back i { font-size: 24px; }
.d-app { font-family: var(--display); font-weight: 700; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; background: var(--volt-deep); color: var(--volt); border-radius: 12px; padding: 8px 12px 7px; }
.d-main { max-width: 440px; margin: 0 auto; text-align: center; padding-top: 22px; }
.d-label { font-family: var(--display); font-weight: 700; font-size: 16px; letter-spacing: .1em; text-transform: uppercase; }
.d-num { font-family: var(--display); font-weight: 900; font-style: italic; font-size: clamp(110px, 38vw, 168px); line-height: .84; letter-spacing: -.03em; margin-top: 6px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.d-unit { font-family: var(--display); font-weight: 800; font-size: 24px; letter-spacing: .02em; text-transform: uppercase; margin-top: 8px; }
.d-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 26px; }
.d-stats div { min-width: 0; }
.d-stats small { display: block; font-family: var(--display); font-weight: 700; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--volt-deep); }
.d-stats b { display: block; font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1; margin-top: 4px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.d-body { max-width: 440px; margin: 0 auto; padding: 8px max(20px, env(safe-area-inset-right, 0px)) 28px max(20px, env(safe-area-inset-left, 0px)); }
.d-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 22px 0 10px; }
.d-h h3 { margin: 0; font-family: var(--display); font-weight: 800; font-style: italic; font-size: 24px; text-transform: uppercase; color: var(--volt); }
.d-h span { font-size: 12px; color: #9AA3AD; }
.chart { width: 100%; height: auto; display: block; }
.chart text { font-family: var(--display); font-weight: 600; font-size: 11px; letter-spacing: .06em; fill: #8E98A3; }
.chart .end { fill: var(--volt); font-weight: 800; font-size: 14px; }
.splits { display: flex; flex-direction: column; gap: 8px; }
.split { display: grid; grid-template-columns: 1fr auto 74px; gap: 12px; align-items: center; background: #1C1F22; border-radius: 16px; padding: 14px 16px; }
.split span { font-size: 15px; font-weight: 500; min-width: 0; }
.split b { font-family: var(--display); font-weight: 800; font-size: 24px; font-variant-numeric: tabular-nums; }
.split i { font-style: normal; font-family: var(--display); font-weight: 700; font-size: 15px; text-align: right; font-variant-numeric: tabular-nums; }
.split i.good { color: var(--good); } .split i.bad { color: var(--bad); } .split i.flat { color: #9AA3AD; }
.d-note { margin-top: 18px; font-size: 13px; line-height: 1.45; color: #9AA3AD; }

/* ---------- Alertas ---------- */
body[data-tab="alertas"] { background: var(--surface); }
.alerts { max-width: 464px; margin: 0 auto; padding: 18px 0 calc(var(--bar-h, 130px) + 24px); }
.alerts .top, .alerts .hello { padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.chat-row { display: grid; grid-template-columns: 60px 1fr; column-gap: 20px; align-items: center; width: 100%; border: 0; background: none; padding: 0 0 0 max(12px, env(safe-area-inset-left, 0px)); font: inherit; color: inherit; text-align: left; cursor: pointer; }
.chat-row { overflow: hidden; transform-origin: 30px 50%; }
.chat-row:active { background: var(--ground); }
.sk-b { display: block; border-radius: 8px; background: linear-gradient(90deg, #E6E9ED 0 40%, #F4F6F8 50%, #E6E9ED 60%) 0 0 / 300% 100%; animation: sk 1.1s linear infinite; }
.sk-media { height: 180px; border-radius: 0; }
@keyframes sk { from { background-position: 100% 0; } to { background-position: 0 0; } }
.chat-row:focus-visible { outline: 3px solid var(--losa); outline-offset: -3px; }
.chat-row .av { width: 60px; height: 60px; margin: 10px 0; }

.badge.urgent { background: #D8524F; }
.badge.unread { background: #0A8FD8; }

.av { border-radius: 50%; display: grid; place-items: center; overflow: hidden; flex: none; font: italic 900 22px var(--display); }
.av img { width: 100%; height: 100%; object-fit: cover; display: block; }
.chipbar { background: #000; }
.chipbar-in { max-width: 464px; margin: 0 auto; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 12px max(20px, env(safe-area-inset-right, 0px)) 12px max(20px, env(safe-area-inset-left, 0px)); }
.chipbar-in::-webkit-scrollbar { display: none; }
.fchip { flex: 1 0 auto; border: 1.5px solid var(--volt); border-radius: 10px; background: none; color: var(--volt); padding: 6px 12px 5px; font: italic 900 20px/1.1 var(--display); text-transform: uppercase; cursor: pointer; }
.fchip[aria-pressed="true"] { background: var(--volt); color: var(--ink); }
.fchip:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

/* ---------- Chat ---------- */
.chat { position: fixed; inset: 0; z-index: 30; background: var(--ground); }
.chat-in { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; display: flex; flex-direction: column; color: var(--ink); }
.feed { flex: 1 0 auto; width: 100%; max-width: 464px; align-self: center; box-sizing: border-box; padding: calc(12px + env(safe-area-inset-top, 0px)) 12px 14px; display: flex; flex-direction: column; gap: 12px; }
.msg { background: var(--surface); border-radius: 30px; overflow: hidden; box-shadow: 0 0 0 1px rgba(0, 0, 0, .05), 0 6px 16px rgba(20, 24, 30, .08); }
.msg-h { display: flex; justify-content: space-between; gap: 12px; padding: 24px 24px 20px; }
.msg-lot { font: italic 900 38px/.9 var(--display); letter-spacing: -.01em; }

.bars { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.pbar { display: block; width: 80px; height: 14px; border-radius: 999px; background: #3A3D40; overflow: hidden; }

.ph-grid > div.flagged, .pd-photo.flagged { outline: 4px solid #D8524F; outline-offset: -4px; }

.trk i { width: 22px; height: 22px; border-radius: 50%; background: #2A2E33; }
.trk .on { color: #fff; } .trk .on i { background: #0A8FD8; }

<script>
(() => {
  // ---------- Motion: springs → CSS linear() ----------
  // Física de resorte amortiguado muestreada como easing; un solo lenguaje de movimiento para toda la app.
  const SUPPORTS_LINEAR = window.CSS && CSS.supports && CSS.supports('transition-timing-function', 'linear(0, 1)');
  const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function spring({ stiffness, damping, mass = 1 }) {
    const w0 = Math.sqrt(stiffness / mass);
    const zeta = damping / (2 * Math.sqrt(stiffness * mass));
    const x = t => {
      if (zeta < 1) {
        const wd = w0 * Math.sqrt(1 - zeta * zeta);
        return 1 - Math.exp(-zeta * w0 * t) * (Math.cos(wd * t) + (zeta * w0 / wd) * Math.sin(wd * t));
      }
      return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
    };
    let T = 0;
    for (let t = 0; t < 3; t += 1 / 240) if (Math.abs(1 - x(t)) > 0.002) T = t;
    T += 1 / 60;
    const n = Math.min(64, Math.max(16, Math.round(T * 60)));
    const pts = [];
    for (let i = 0; i <= n; i++) pts.push(i === n ? '1' : x(T * i / n).toFixed(4));
    return {
      duration: Math.round(T * 1000),
      easing: SUPPORTS_LINEAR ? `linear(${pts.join(', ')})` : 'cubic-bezier(.2, .9, .25, 1.08)'
    };
  }
  const M = {
    snap: spring({ stiffness: 520, damping: 26 }),   // soltar un tile
    pop: spring({ stiffness: 340, damping: 27 }),    // abrir popup, leve sobrepaso
    expand: spring({ stiffness: 260, damping: 30 }), // tile → pantalla de detalle
    exit: spring({ stiffness: 420, damping: 42 })    // cerrar, sin rebote
  };
  if (SUPPORTS_LINEAR) document.documentElement.style.setProperty('--ease-snap', M.snap.easing);

  const anim = (el, frames, m, extra = {}) =>
    el.animate(frames, REDUCED ? { duration: 1, fill: 'forwards' } : { duration: m.duration, easing: m.easing, fill: 'forwards', ...extra });
  const fade = (el, from, to, duration, delay = 0) =>
    el.animate([{ opacity: from }, { opacity: to }], { duration: REDUCED ? 1 : duration, delay: REDUCED ? 0 : delay, easing: 'ease-out', fill: 'both' });

  // ---------- Datos (ejemplo) ----------
  // 12 semanas, la última es la actual. El valor mostrado siempre es el último punto de la serie.
  const AREAS = ['Producción', 'Materiales', 'Personas', 'Ventas', 'Finanzas'];
  // Apps de Adelante de donde sale cada dato.
  const APP_NAMES = { A3: 'Tres Amigos', B0: 'Boletas', H4: 'Horas', V5: 'Ventas', BC: 'Business Central' };
  const KPIS = {
    ppc: { area: 'Producción', app: 'A3', label: 'PPC semanal', unit: '% del plan cumplido', pct: true, good: 'up', target: 85,
      series: [71, 74, 69, 76, 80, 77, 73, 79, 82, 75, 76, 78],
      by: 'Por cuadrilla', rows: [['Losa 1', '84%', 6], ['Losa 2', '79%', 2], ['Soldadura', '81%', -3], ['Repello', '72%', -5], ['Enchape', '74%', 1]],
      note: 'Porcentaje de tareas comprometidas en el sprint que se completaron.' },
    entregadas: { area: 'Producción', app: 'A3', label: 'Viviendas entregadas', unit: 'viviendas / semana', good: 'up', target: 15,
      series: [9, 11, 10, 12, 12, 13, 11, 14, 12, 13, 15, 14],
      by: 'Por etapa', rows: [['Etapa 1', '6', 1], ['Etapa 2', '5', -1], ['Etapa 3', '3', 0]],
      note: 'Viviendas que salieron de la última estación (Pintura y Reparaciones) esta semana.' },
    takt: { area: 'Producción', app: 'A3', label: 'Takt de Losa', unit: 'días por vivienda', dec: 1, good: 'down', target: 4,
      series: [4.9, 4.8, 4.7, 4.8, 4.5, 4.6, 4.4, 4.5, 4.3, 4.4, 4.3, 4.2],
      by: 'Por cuadrilla', rows: [['Losa 1', '4,0', -0.2], ['Losa 2', '4,4', 0]],
      note: 'Losa marca el ritmo de toda la cascada: cada día que baja aquí se gana aguas abajo.' },
    wip: { area: 'Producción', app: 'A3', label: 'Viviendas en proceso', unit: 'viviendas abiertas', good: 'none',
      series: [58, 60, 61, 59, 62, 64, 63, 61, 62, 65, 64, 63],
      by: 'Por estación', rows: [['Losa', '4', 0], ['Muros y soldadura', '14', 1], ['Repello', '12', -1], ['Liviano y complementarias', '19', 0], ['Acabados', '14', -1]],
      note: 'Inventario en proceso. Si sube sin que suban las entregas, hay un cuello de botella.' },
    missmat: { area: 'Producción', app: 'A3', label: 'Fallas por materiales', unit: '% de tareas no cumplidas', pct: true, good: 'down', target: 25,
      series: [33, 35, 38, 36, 40, 44, 39, 42, 45, 43, 40, 41],
      by: 'Causas de incumplimiento', rows: [['Materiales', '41%', 1], ['Prerrequisito no listo', '24%', -2], ['Clima', '14%', 3], ['Cambio de diseño', '9%', -1], ['Cuadrilla', '8%', 0], ['Otro', '4%', -1]],
      note: 'Cuando materiales domina, la palanca está aguas arriba, en B0, no en el ritual del sprint.' },
    solpend: { area: 'Materiales', app: 'B0', label: 'Solicitudes pendientes', unit: 'solicitudes abiertas', good: 'down', target: 15,
      series: [18, 22, 19, 25, 21, 24, 30, 26, 23, 29, 31, 27],
      by: 'Por antigüedad', rows: [['Menos de 24 h', '11', -3], ['1 a 3 días', '10', 0], ['Más de 3 días', '6', -1]],
      note: 'Solicitudes de material de jefes de obra que todavía no se han despachado.' },
    entregamat: { area: 'Materiales', app: 'B0', label: 'Entrega de material', unit: 'días promedio', dec: 1, good: 'down', target: 2,
      series: [3.4, 3.1, 3.3, 3.0, 2.9, 3.2, 2.8, 2.9, 2.7, 2.8, 2.5, 2.6],
      by: 'Por familia', rows: [['Acero', '3,1', 0.2], ['Cemento y agregados', '1,8', -0.1], ['Eléctrico', '2,9', 0.3], ['Acabados', '2,7', -0.4]],
      note: 'Desde que se crea la solicitud en B0 hasta que el material llega a la obra.' },
    horas: { area: 'Personas', app: 'H4', label: 'Horas registradas', unit: 'horas / semana', good: 'up',
      series: [9420, 9510, 9380, 9600, 9710, 9650, 9580, 9800, 9760, 9690, 9900, 9840],
      by: 'Por área', rows: [['Cadena de vivienda', '6 980', -40], ['Infraestructura', '1 720', 0], ['Planta y bodega', '760', -20], ['Administración', '380', 0]],
      note: 'Horas registradas en H4 por supervisores y gerentes.' },
    asistencia: { area: 'Personas', app: 'H4', label: 'Asistencia', unit: '% del personal programado', pct: true, good: 'up', target: 96,
      series: [92, 93, 91, 94, 95, 93, 92, 94, 95, 93, 94, 94],
      by: 'Por cuadrilla', rows: [['Formaleta', '97%', 1], ['Repello', '91%', -2], ['Complementarias', '93%', 0], ['Soldadura', '96%', 1]],
      note: 'Asistencia contra el personal asignado a obra en H4.' },
    personal: { area: 'Personas', app: 'H4', label: 'Personal activo', unit: 'personas', good: 'none',
      series: [201, 203, 204, 206, 205, 208, 210, 209, 211, 212, 213, 214],
      by: 'Por área', rows: [['Cadena de vivienda', '151', 1], ['Infraestructura', '34', 0], ['Planta y bodega', '17', 0], ['Administración', '12', 0]],
      note: 'Personas con rol y obra asignados en H4.' },
    vendidas: { area: 'Ventas', app: 'V5', label: 'Viviendas vendidas', unit: 'viviendas / semana', good: 'up', target: 7,
      series: [4, 6, 5, 7, 5, 6, 8, 5, 7, 6, 4, 6],
      by: 'Por producto', rows: [['Casa 2 habitaciones', '3', 1], ['Casa 3 habitaciones', '2', 1], ['Lote con servicios', '1', 0]],
      note: 'Contratos de venta firmados en la semana.' },
    reservas: { area: 'Ventas', app: 'V5', label: 'Reservas activas', unit: 'reservas', good: 'up',
      series: [34, 35, 37, 36, 38, 39, 40, 38, 39, 41, 40, 41],
      by: 'Por estado', rows: [['En trámite de crédito', '23', 2], ['Con prima completa', '11', -1], ['Recién reservadas', '7', 0]],
      note: 'Reservas que aún no pasan a contrato.' },
    ventasmonto: { area: 'Ventas', app: 'V5', label: 'Ventas firmadas', unit: 'millones de ₡ / semana', good: 'up',
      series: [310, 420, 365, 505, 350, 430, 580, 360, 495, 440, 290, 435],
      by: 'Por producto', rows: [['Casa 2 habitaciones', '₡ 198 M', 70], ['Casa 3 habitaciones', '₡ 172 M', 85], ['Lote con servicios', '₡ 65 M', -10]],
      note: 'Monto de contratos firmados en V5.' },
    costom2: { area: 'Finanzas', app: 'BC', label: 'Costo directo por m²', unit: 'miles de ₡ / m²', good: 'down', target: 400,
      series: [398, 401, 403, 405, 404, 407, 409, 408, 410, 411, 413, 412],
      by: 'Por partida', rows: [['Materiales', '238', 2], ['Mano de obra', '131', -1], ['Equipo', '27', 0], ['Subcontratos', '16', -2]],
      note: 'Costo directo de construcción por metro cuadrado, desde Business Central.' },
    desvio: { area: 'Finanzas', app: 'BC', label: 'Desvío vs presupuesto', unit: '% sobre presupuesto', pct: true, dec: 1, good: 'down', target: 2,
      series: [1.2, 1.5, 1.9, 2.1, 2.4, 2.2, 2.8, 3.1, 3.3, 3.5, 4.1, 3.8],
      by: 'Por etapa', rows: [['Etapa 1', '2,1%', -0.2], ['Etapa 2', '4,6%', -0.4], ['Etapa 3', '5,2%', 0.1]],
      note: 'Costo real acumulado contra presupuesto aprobado.' }
  };

  const SLOTS = ['hero', 'sm', 'sm', 'wide', 'sm', 'sm', 'sm', 'sm'];
  const SLOT_NAME = { hero: 'espacio principal', sm: 'espacio pequeño', wide: 'espacio ancho' };
  const DEFAULT = ['ppc', 'entregadas', 'solpend', null, 'vendidas', null, 'asistencia', null];
  const KEY = 'adelante-kpi-slots-v1';

  let slots = DEFAULT.slice();
  try {
    const saved = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (Array.isArray(saved) && saved.length === SLOTS.length && saved.every(k => k === null || KPIS[k])) slots = saved;
  } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(slots)); } catch (e) {} };

  // ---------- Formato ----------
  const fmt = (v, dec = 0) => v.toLocaleString('es-CR', { minimumFractionDigits: dec, maximumFractionDigits: dec });
  const valueOf = k => KPIS[k].series[KPIS[k].series.length - 1];
  const show = k => fmt(valueOf(k), KPIS[k].dec || 0) + (KPIS[k].pct ? '%' : '');
  function delta(k) {
    const s = KPIS[k].series, d = s[s.length - 1] - s[s.length - 2], dec = KPIS[k].dec || 0;
    const r = Math.round(d * 10 ** dec) / 10 ** dec;
    const cls = r === 0 || KPIS[k].good === 'none' ? 'flat' : ((r > 0) === (KPIS[k].good === 'up') ? 'good' : 'bad');
    const arrow = r > 0 ? '▲' : r < 0 ? '▼' : '■';
    const unit = KPIS[k].pct ? ' pts' : '';
    return { cls, text: `${arrow} ${r > 0 ? '+' : r < 0 ? '−' : ''}${fmt(Math.abs(r), dec)}${unit}` };
  }
  function isoWeek(d) {
    const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    const day = t.getUTCDay() || 7;
    t.setUTCDate(t.getUTCDate() + 4 - day);
    const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
    return Math.ceil(((t - y0) / 864e5 + 1) / 7);
  }
  const WEEK = isoWeek(new Date());
  document.getElementById('week').textContent = `Semana ${WEEK} · Ciudad del Valle`;

  // ---------- Sparkline / gráfico ----------
  function sparkPath(s, w, h, pad, target) {
    const vals = target != null ? s.concat(target) : s;
    let lo = Math.min(...vals), hi = Math.max(...vals);
    const span = hi - lo || 1; lo -= span * .12; hi += span * .12;
    const X = i => pad + i * (w - pad * 2) / (s.length - 1);
    const Y = v => h - pad - (v - lo) / (hi - lo) * (h - pad * 2);
    return { X, Y, d: s.map((v, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(' ') };
  }
  function sparkSVG(k, stroke) {
    const s = KPIS[k].series, { X, Y, d } = sparkPath(s, 160, 64, 5);
    const last = s.length - 1;
    return `<svg class="spark" viewBox="0 0 160 64" preserveAspectRatio="none" aria-hidden="true">
      <path d="${d}" fill="none" stroke="${stroke}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
      <circle cx="${X(last)}" cy="${Y(s[last])}" r="4" fill="${stroke}"/></svg>`;
  }
  function chartSVG(k) {
    const c = KPIS[k], s = c.series, W = 340, H = 170, top = 16, bot = 26, padX = 12;
    const vals = c.target != null ? s.concat(c.target) : s;
    let lo = Math.min(...vals), hi = Math.max(...vals);
    const span = hi - lo || 1; lo -= span * .15; hi += span * .15;
    const X = i => padX + i * (W - padX * 2 - 30) / (s.length - 1);
    const Y = v => top + (hi - v) / (hi - lo) * (H - top - bot);
    const line = s.map((v, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(' ');
    const area = `${line} L${X(s.length - 1).toFixed(1)} ${H - bot} L${X(0).toFixed(1)} ${H - bot} Z`;
    const grid = [0, 1, 2, 3].map(j => { const y = top + j * (H - top - bot) / 3; return `<line x1="${padX}" x2="${W - padX}" y1="${y}" y2="${y}" stroke="#2A2E33" stroke-width="1"/>`; }).join('');

  function openDetail(i) {

  function edgeSwipe(el, { isOpen, onStart, onCancel, onDone }) {
    let drag = null;
    el.addEventListener('pointerdown', e => {
      if (busy || !isOpen() || e.button > 0 || e.clientX > EDGE) return;
      drag = { id: e.pointerId, x: e.clientX, y: e.clientY, dx: 0, t: performance.now(), v: 0, on: false };
    });

  const springOpts = (m, delay = 0) => REDUCED ? { duration: 1, fill: 'both' } : { duration: m.duration, easing: m.easing, delay, fill: 'both' };
  // Filtrar una lista: los que salen se encogen con resorte (y los de abajo suben), después

  async function filterSwap(items, isIn) {
    const leave = items.filter(el => !el.hidden && !isIn(el)), enter = items.filter(el => el.hidden && isIn(el));
    const full = el => { const cs = getComputedStyle(el); return { height: el.offsetHeight + 'px', paddingTop: cs.paddingTop, paddingBottom: cs.paddingBottom, opacity: 1, transform: 'scale(1)' }; };

  // Problemas de ejemplo por chat (k = posición del mensaje en ese chat): flag = foto señalada

  const ISSUES = {

  const mixHex = (a, b, t) => '#' + [1, 3, 5].map(i =>

  function budgetBar(p) {

  const avatarHTML = c => c.img

  const inFilter = c => chatFilter === 'Todo' || c.cat === chatFilter;

  function renderChats() {

  // ---------- Chat ----------
  const chat = $('chat'), chatIn = $('chat-in');

  // ---------- Detalle de despacho: boleta + fotos ----------
  const post = $('post'), postIn = $('post-in'), pdBack = $('pd-back');

  // Transform que pone el texto del lote grande exactamente sobre el texto del lote de la tarjeta,
  // estando el detalle en la posición `box` (se mide el texto, no la caja: el grande va centrado).
  function lotDelta(lot, cardLot, box) {
    const text = el => { const r = document.createRange(); r.selectNodeContents(el); return r.getBoundingClientRect(); };
    const s = parseFloat(getComputedStyle(cardLot).fontSize) / parseFloat(getComputedStyle(lot).fontSize);
    const lb = lot.getBoundingClientRect(), lt = text(lot), ct = text(cardLot), ri = postIn.getBoundingClientRect();
    const x = box.left + (lb.left - ri.left) + s * (lt.left - lb.left);
    const y = box.top + (lb.top - ri.top) + s * (lt.top - lb.top);
    return `translate(${ct.left - x}px, ${ct.top - y}px) scale(${s})`;

          ${rows}
          <div class="rc-row rc-total"><span>Total</span><b class="pre${docSum(p, 4) > docSum(p, 2) ? ' bad' : ''}">${docSum(p, 2)}</b><b>${docSum(p, 3)}</b><b class="${budgetCls(docSum(p, 2), docSum(p, 4))}">${docSum(p, 4)}</b></div>

    post.animate([{ backgroundColor: '#111315' }, { backgroundColor: 'rgba(17, 19, 21, 0)' }], { duration: REDUCED ? 1 : 300, delay: D * .6, easing: 'ease-out', fill: 'forwards' });

  function finishPost() {
    [post, postIn, pdBack].forEach(el => el.getAnimations().forEach(x => x.cancel()));

  // ---------- Rebote elástico (como en Histok) ----------
  // No se bloquea el rebote nativo de iOS (da la inercia); encima, el contenido se encoge
  // hasta 5 % hacia el borde que se estira y vuelve con resorte al soltar.
  const SPRING_BACK = spring({ stiffness: 210, damping: 26 });
  function rubber(scroller, target) {
    const isWin = scroller === window;
    let pinned = null, edge = 'top';
    const pos = () => isWin ? scrollY : scroller.scrollTop;
    const max = () => isWin ? document.documentElement.scrollHeight - innerHeight : scroller.scrollHeight - scroller.clientHeight;
    scroller.addEventListener('touchmove', e => {
      const t = target();
      if (e.touches.length !== 1 || !t) return;
      const y = e.touches[0].clientY, sy = pos();
      const atTop = sy <= 0, atBottom = sy >= max() - 1;
      if (atTop || atBottom) {
        if (pinned === null) { pinned = y; edge = atTop ? 'top' : 'bottom'; }
        const d = y - pinned, over = edge === 'top' ? Math.max(0, d) : Math.max(0, -d);
        t.style.transformOrigin = edge === 'top' ? '50% 0%' : '50% 100%';
        t.style.transform = over ? `scale(${1 - Math.min(over, 300) / 300 * 0.05})` : '';
      } else if (pinned !== null) { pinned = null; t.style.transform = ''; }
    }, { passive: true });
    const end = () => {
      pinned = null;
      const t = target();
      if (!t || !t.style.transform) return;
      const from = t.style.transform;
      t.style.transform = '';
      if (!REDUCED) t.animate([{ transform: from }, { transform: 'scale(1)' }], { duration: SPRING_BACK.duration, easing: SPRING_BACK.easing });
    };
    scroller.addEventListener('touchend', end);
    scroller.addEventListener('touchcancel', end);
  }
  // Se encoge el contenido, nunca el contenedor que scrollea: cambiar el transform del

  edgeSwipe(post, {
    isOpen: () => !post.hidden,
    onStart: () => { postCard.style.visibility = ''; },
    onCancel: () => { postCard.style.visibility = 'hidden'; },
    onDone: finishPost
  });

  renderFilters(); renderChats();
})();
